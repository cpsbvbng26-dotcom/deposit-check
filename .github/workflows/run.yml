name: run
# Run the tool against the live APIs: by hand, or once a week for the author's own iD.
# The report goes to the job summary. For the author's iD it also goes to one open issue, which closes itself
# when no error or warning is left.
on:
  workflow_dispatch:
    inputs:
      orcid:
        description: ORCID iD to check
        required: true
        default: 0009-0000-1406-0547
  schedule:
    - cron: '23 5 * * 2'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    # The weekly issue is the only write, so only this job gets it.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node bin/deposit-check.js --orcid "${ORCID:-$OWNER_ORCID}" --summary --fail-on never --out report.md --json-out report.json > /dev/null
        env:
          ORCID: ${{ inputs.orcid }}
          OWNER_ORCID: 0009-0000-1406-0547
      - run: node scripts/weekly-issue.js report.json report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_ORCID: 0009-0000-1406-0547
