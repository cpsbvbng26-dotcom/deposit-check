name: check
# Also once a week with nothing changed: a secret or an address can be found on a quiet day too.
on:
  push:
  pull_request:
  schedule:
    - cron: '37 4 * * 4'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node verification/check.js

  # action.yml, used on this repository itself, on the example and without the network.
  # An action that looked at nothing would pass the first step too, so the second one must fail.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The example passes
        uses: ./
        with:
          expect-types: examples/expected-types.json
          answers: examples/answers.json
      - name: The example fails once warnings count
        id: warnings
        continue-on-error: true
        uses: ./
        with:
          expect-types: examples/expected-types.json
          answers: examples/answers.json
          fail-on: warning
      - name: Check that it failed
        if: steps.warnings.outcome != 'failure'
        run: exit 1
