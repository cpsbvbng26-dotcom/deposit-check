name: draft-pdf
# The draft PDF of the JOSS paper, built by the Open Journals action that JOSS's guide to the paper names, so that a change to
# paper/ is compiled as JOSS compiles it. The PDF is kept as an artifact of the run; nothing is committed.
on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/draft-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The commit of the master branch on 2026-11-25 (the action has no tag at it). The action runs the image
      # openjournals/inara:latest, which this pin does not fix.
      - uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6 # master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
          archive: false
