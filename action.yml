name: deposit-check
description: Check the DOI metadata of a researcher's deposits against their ORCID record, and write the report to the job summary.
inputs:
  orcid:
    description: An ORCID iD. The works on its record, and the works whose metadata carries it, are checked.
    required: false
  dois:
    description: DOIs to check as well, separated by spaces or commas.
    required: false
  expect-types:
    description: A JSON file of DOIs and the resource type (DataCite resourceTypeGeneral) each should have. Each DOI in it is checked as well.
    required: false
  fail-on:
    description: error, warning, info or never. The step fails when a finding is this serious or more.
    required: false
    default: error
  mailto:
    description: A contact address that Crossref asks callers to give. Optional.
    required: false
  answers:
    description: A JSON file of recorded answers of the APIs, read instead of the network. For the example in examples/ and for trying the action.
    required: false
runs:
  using: composite
  steps:
    # The inputs reach the shell only through the environment.
    - shell: bash
      run: |
        args=(--fail-on "$FAIL_ON" --summary)
        if [ -n "$ORCID" ]; then args+=(--orcid "$ORCID"); fi
        if [ -n "$DOIS" ]; then args+=(--doi "$DOIS"); fi
        if [ -n "$EXPECT_TYPES" ]; then args+=(--expect-types "$EXPECT_TYPES"); fi
        if [ -n "$ANSWERS" ]; then args+=(--answers "$ANSWERS"); fi
        node "$GITHUB_ACTION_PATH/bin/deposit-check.js" "${args[@]}"
      env:
        ORCID: ${{ inputs.orcid }}
        DOIS: ${{ inputs.dois }}
        EXPECT_TYPES: ${{ inputs.expect-types }}
        ANSWERS: ${{ inputs.answers }}
        FAIL_ON: ${{ inputs.fail-on }}
        DEPOSIT_CHECK_MAILTO: ${{ inputs.mailto }}
branding:
  icon: check-square
  color: blue
